name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Pin Python ${{ matrix.python-version }}
        run: uv python pin ${{ matrix.python-version }}

      - name: Install project + dev deps
        run: uv sync --frozen --group dev || uv sync --group dev

      - name: Import sanity check
        run: uv run python -c "from scottylabs_mcp import client, clerk_auth, tools, server, auth_helper, models; print('imports ok')"

      - name: Run tests
        run: uv run pytest -v

      - name: Build sdist + wheel (verify packaging)
        run: uv build
